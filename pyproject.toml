[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ideon"
version = "0.1.0"
description = "IDEON - Sistema de Gestão de Atividades Educacionais"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.2",
    "python-dotenv==1.2.1",
    "pypdf==6.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
py-modules = ["app", "db", "ia", "materiais"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=xml --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*.venv/*",
]